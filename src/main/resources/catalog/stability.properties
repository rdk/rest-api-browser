# Paths of each product's supported (public) REST APIs, as regular expressions over the module path ("api/2"), from
# the classic UI's rest_resources_service.js. Keys are SAL platform ids (ApplicationProperties.getPlatformId()).
# A module that matches is "supported"; one from a user-installed app is "app"; everything else is "internal".
jira=^api/2(/|$),^auth/,^activities/
conf=^api(/|$)
bitbucket=^api/,^audit/,^build-status/,^jira/1\\.0(/|$),^ssh/,^branch-permissions/,^auth/
bamboo=^api/
