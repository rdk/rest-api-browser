name: Verify build, lint, tests and mock E2E
description: Fast push/PR check (unit tests, lint, Python CLI) or full release check (package, mock Playwright E2E).

inputs:
  mode:
    description: 'fast (push/PR: unit tests + lint + Python CLI) or full (release/manual: package + mock Playwright E2E)'
    required: false
    default: 'fast'

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: target/node
        key: ${{ runner.os }}-node-${{ hashFiles('pom.xml') }}

    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('src/main/frontend/package-lock.json', 'src/test/product/package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    # unit tests: the Java ones and the new UI's (npm test through frontend-maven-plugin)
    - name: Maven package (full)
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: mvn -B -ntp package

    - name: Maven test (fast)
      if: ${{ inputs.mode != 'full' }}
      shell: bash
      run: mvn -B -ntp test

    - name: JS/TS lint, syntax & Python client tests
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
        npm --prefix src/main/frontend run lint:all
        node --check src/main/resources/assets/admin/admin-intro.js
        node --check src/test/harness/mock.js
        node --check src/test/product/cdp.js
        node --check src/test/product/ui.js
        node --check src/test/product/ui_next.js
        python3 -B -m py_compile src/test/product/smoke.py src/test/product/mcp_pat_check.py client/rab.py client/test_rab.py
        python3 -B -m unittest discover -s client -v

    - name: Offline mock Playwright E2E
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
        cd src/test/product
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
        npm run typecheck
        npm run test:mock
