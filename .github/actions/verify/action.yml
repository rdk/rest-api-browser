name: Verify build, lint, tests and mock E2E
description: Build Maven package (Java + Vitest unit tests), run oxlint/syntax/Python CLI checks, and run offline mock Playwright E2E.

runs:
  using: composite
  steps:
    # unit tests: the Java ones and the new UI's (npm test through frontend-maven-plugin)
    - name: Maven package (Java + Vitest tests)
      shell: bash
      run: mvn -B -ntp package

    - name: JS/TS lint, syntax & Python client tests
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
        npm --prefix src/main/frontend run lint:all
        node --check src/main/resources/assets/admin/admin-intro.js
        node --check src/test/harness/mock.js
        node --check src/test/product/cdp.js
        node --check src/test/product/ui.js
        node --check src/test/product/ui_next.js
        python3 -B -m py_compile src/test/product/smoke.py src/test/product/mcp_pat_check.py client/rab.py client/test_rab.py
        python3 -B -m unittest discover -s client -v

    - name: Offline mock Playwright E2E
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
        cd src/test/product
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
        npm run typecheck
        npm run test:mock
