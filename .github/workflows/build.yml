name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run full packaging, mock Playwright E2E, and upload JAR'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/verify
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true && 'full' || 'fast' }}
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        with:
          name: rest-api-browser-jar
          path: target/rest-api-browser-*.jar
