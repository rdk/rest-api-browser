name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: ./.github/actions/verify
      - uses: actions/upload-artifact@v7
        with:
          name: rest-api-browser-jar
          path: target/rest-api-browser-*.jar
