# Pushing a tag such as 4.0.5 builds the jar of that version and creates a draft release with it. Check the jar,
# write the release notes and publish the draft by hand.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check that the tag is the version in pom.xml
        run: |
          version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "pom.xml has version $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: mvn -B -ntp package
      - name: JS/TS lint, syntax & Python client tests
        run: |
          if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
          npm --prefix src/main/frontend run lint:all
          node --check src/main/resources/assets/admin/admin-intro.js
          node --check src/test/harness/mock.js
          node --check src/test/product/cdp.js
          node --check src/test/product/ui.js
          node --check src/test/product/ui_next.js
          python3 -B -m py_compile src/test/product/smoke.py src/test/product/mcp_pat_check.py client/rab.py client/test_rab.py
          python3 -B -m unittest discover -s client -v
      - name: Offline mock Playwright E2E
        run: |
          if [ -d "$GITHUB_WORKSPACE/target/node" ]; then export PATH="$GITHUB_WORKSPACE/target/node:$PATH"; fi
          cd src/test/product
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npm run typecheck
          npm run test:mock
      - name: Create a draft release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping create."
          else
            gh release create "$GITHUB_REF_NAME" \
              "target/rest-api-browser-$GITHUB_REF_NAME.jar" \
              "client/rab.py" \
              --draft --title "$GITHUB_REF_NAME" --notes "Built by GitHub Actions from $GITHUB_SHA."
          fi
