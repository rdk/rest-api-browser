version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "com.atlassian.platform.dependencies:*"
      - dependency-name: "com.atlassian.pom:*"
      - dependency-name: "com.atlassian.annotations:*"
      - dependency-name: "com.atlassian.maven.plugins:*"
      - dependency-name: "com.atlassian.plugins:*"
      - dependency-name: "org.glassfish.jersey.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/src/main/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/test/product"
    schedule:
      interval: "weekly"
    groups:
      product-test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
